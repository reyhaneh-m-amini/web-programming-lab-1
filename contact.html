<!DOCTYPE html>

<head>
    <title>Meet Daia - Contact</title>
</head>

<body>

    <header>
        <h1>Meet Daia: The Naze Tala</h1>
        <nav>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Daia</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="contact.html">Contact Me</a></li>
        </nav>
    </header>

    <main>
        <h2>Get in Touch with Daia's Manager</h2>
        
        <form action="#" method="post">
            <fieldset>
                <legend>Send a Fan Message or Treat Recommendation</legend>
                
                <p>
                    <label for="full-name">Your Full Name:</label><br>
                    <input type="text" id="full-name" name="full-name" placeholder="e.g. Abbas Abbasi" required>
                </p>
                
                <p>
                    <label for="email-address">Your Email Address:</label><br>
                    <input type="email" id="email-address" name="email-address" placeholder="abbasi@example.com" required>
                </p>
                
                <p>
                    <label for="visit-date">Date of Greeting or Observation:</label><br>
                    <input type="date" id="visit-date" name="visit-date" required>
                </p>
                
                <p>
                    <label for="message-category">Category of Inquiry:</label><br>
                    <select id="message-category" name="message-category" required>
                        <option value="">-- Please select an option --</option>
                        <option value="fan-mail">General Fan Mail</option>
                        <option value="treat-recipe">Treat or Food Recommendation</option>
                        <option value="photo-request">Photo Request</option>
                        <option value="playdate">Playdate or Cuddle Inquiry</option>
                    </select>
                </p>
                
                <p>
                    <label for="message-content">Your Message:</label><br>
                    <textarea id="message-content" name="message-content" rows="6" cols="45" placeholder="Write your message here for Daia!"></textarea>
                </p>
                
                <p>
                    <input type="submit" value="Send Message">
                    <input type="reset" value="Reset Form">
                </p>
            </fieldset>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Reyhaneh Mobasher Amini. All rights reserved.</p>
    </footer>

</body>
</html>
